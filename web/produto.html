<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoTIFF product — trend</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      html, body { height: 100%; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #10140f; color: #f4efe6; }
      #map { position: absolute; inset: 0; }
      .leaflet-image-layer { image-rendering: pixelated; }
      .panel {
        position: absolute; z-index: 500; top: 12px; left: 12px; width: min(420px, calc(100% - 24px));
        background: rgba(16, 20, 15, 0.92); border: 1px solid rgba(240, 195, 106, 0.45);
        border-radius: 14px; padding: 16px; max-height: calc(100% - 24px); overflow: auto;
      }
      h1 { font-size: 1.05rem; margin: 0 0 6px; }
      p, li { font-size: 0.78rem; line-height: 1.4; color: #e7d7c3; }
      p { margin: 0 0 8px; }
      ul { margin: 0; padding-left: 18px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
      button {
        font: inherit; font-size: 0.78rem; color: #f4efe6; background: transparent;
        border: 1px solid rgba(240, 195, 106, 0.45); border-radius: 999px;
        padding: 6px 10px; cursor: pointer;
      }
      button.on { background: #f0c36a; color: #1b1408; border-color: #f0c36a; }
      .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
      .ramp { height: 12px; border-radius: 6px; margin-top: 4px;
        background: linear-gradient(to right, rgb(196, 176, 130), rgb(176, 48, 36)); }
      .ticks { display: flex; justify-content: space-between; font-size: 0.68rem; color: #cbbba6; margin-top: 3px; }
      #rain strong { color: #f4efe6; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <aside class="panel">
      <p><a href="modelo.html" style="color:#f0c36a">← Model</a></p>
      <h1>Trend in the product</h1>
      <p id="lead">Reading the GeoTIFFs…</p>
      <div class="row" id="places"></div>
      <div class="row" id="layers"></div>
      <div id="legend"></div>
      <p id="where"></p>
      <div id="rain"></div>
      <ul id="facts"></ul>
    </aside>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
    <script>
      const map = L.map("map", { zoomControl: false }).setView([-8.2, -39.2], 7);
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19, attribution: "Esri, Maxar · GeoTIFF product" }
      ).addTo(map);

      const state = { slug: null, layer: "classe" };
      const places = {};
      const overlays = {};
      const NODATA = -9999;

      function comma(value, digits) {
        return Number(value).toFixed(digits);
      }

      function missing(value) {
        return !Number.isFinite(value) || value <= NODATA + 1;
      }

      function sample(band) {
        for (let i = 0; i < band.length; i += 1) {
          if (!missing(band[i])) return band[i];
        }
        return null;
      }

      function paint(place) {
        const canvas = document.createElement("canvas");
        canvas.width = place.width;
        canvas.height = place.height;
        const ctx = canvas.getContext("2d");
        const image = ctx.createImageData(place.width, place.height);
        const data = image.data;
        const write = (index, red, green, blue) => {
          const offset = index * 4;
          data[offset] = red;
          data[offset + 1] = green;
          data[offset + 2] = blue;
          data[offset + 3] = 215;
        };
        if (state.layer === "classe") {
          const klass = place.bands[2];
          for (let i = 0; i < klass.length; i += 1) {
            const value = klass[i];
            if (missing(value) || value < 0.5) continue;
            if (value < 1.5) write(i, 196, 92, 38);
            else if (value < 2.5) write(i, 212, 168, 48);
            else write(i, 176, 48, 36);
          }
        } else {
          const band = state.layer === "modis" ? place.bands[0] : place.bands[1];
          const limit = state.layer === "modis" ? 2 : 0.4;
          for (let i = 0; i < band.length; i += 1) {
            const value = band[i];
            if (missing(value) || value >= 0) continue;
            const scaled = Math.max(-1, value / limit);
            write(i, 196 + scaled * 20, 176 + scaled * 128, 130 + scaled * 94);
          }
        }
        ctx.putImageData(image, 0, 0);
        return canvas.toDataURL();
      }

      function draw() {
        Object.values(places).forEach((place) => {
          if (overlays[place.slug]) map.removeLayer(overlays[place.slug]);
          overlays[place.slug] = L.imageOverlay(paint(place), place.leafletBounds, { opacity: 0.9, interactive: false }).addTo(map);
        });
        document.querySelectorAll("#layers button").forEach((button) => {
          button.classList.toggle("on", button.dataset.id === state.layer);
        });
        const legend = document.getElementById("legend");
        legend.innerHTML = state.layer === "classe"
          ? '<p><span class="swatch" style="background:#c45c26"></span>MODIS only · <span class="swatch" style="background:#d4a830"></span>NISAR only · <span class="swatch" style="background:#b03024"></span>both</p>'
          : '<div class="ramp"></div><div class="ticks"><span>weak decline</span><span>declining pixels only</span><span>strong decline</span></div>';
      }

      function select(slug, zoom) {
        state.slug = slug;
        const place = places[slug];
        document.querySelectorAll("#places button").forEach((button) => {
          button.classList.toggle("on", button.dataset.id === slug);
        });
        const counts = place.counts;
        const orbit = String(place.meta.orbit).replace("descendente", "descending").replace("quadro", "frame");
        document.getElementById("where").textContent =
          place.meta.place + ". Orbit " + orbit + ". A 0.01° grid read from products/" + place.meta.file + ".";
        document.getElementById("rain").innerHTML =
          "<p><strong>Climate at one point inside the raster.</strong> This is not a map. 2001–2025: rain " +
          comma(place.climate.longRain, 1) + " mm per year, temperature " + comma(place.climate.longTemp, 2) +
          " °C per year. MODIS window: rain " + comma(place.climate.windowRain, 1) +
          " mm per year, September temperature " + comma(place.climate.windowTemp, 2) + " °C per year.</p>";
        document.getElementById("facts").innerHTML =
          "<li>Class, counted in the GeoTIFF: " + counts.modis + " MODIS-only pixels, " + counts.nisar +
          " NISAR-only, " + counts.both + " in both. " + counts.steady + " were observed and do not decline.</li>" +
          "<li>MODIS: " + place.coverage.modis + " pixels with a slope. NISAR: " + place.coverage.nisar +
          " pixels. Where the preview is missing, the band stays empty.</li>";
        if (zoom) map.fitBounds(place.leafletBounds, { paddingTopLeft: [460, 24], paddingBottomRight: [24, 24], maxZoom: 12 });
      }

      function summarize(bands) {
        const klass = bands[2];
        const counts = { modis: 0, nisar: 0, both: 0, steady: 0 };
        let modis = 0;
        let nisar = 0;
        for (let i = 0; i < bands[0].length; i += 1) {
          if (!missing(bands[0][i])) modis += 1;
          if (!missing(bands[1][i])) nisar += 1;
          const value = klass[i];
          if (missing(value)) continue;
          if (value < 0.5) counts.steady += 1;
          else if (value < 1.5) counts.modis += 1;
          else if (value < 2.5) counts.nisar += 1;
          else counts.both += 1;
        }
        return {
          counts,
          coverage: { modis, nisar },
          climate: {
            longRain: sample(bands[3]),
            longTemp: sample(bands[4]),
            windowRain: sample(bands[5]),
            windowTemp: sample(bands[6]),
          },
        };
      }

      async function productManifest() {
        if (window.PRODUCT) return window.PRODUCT.manifest;
        const response = await fetch("products/manifest.json");
        return response.json();
      }

      async function productTiff(meta) {
        if (window.PRODUCT) {
          const binary = atob(window.PRODUCT.tifs[meta.slug]);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          return GeoTIFF.fromArrayBuffer(bytes.buffer);
        }
        const buffer = await fetch("products/" + meta.file).then((response) => response.arrayBuffer());
        return GeoTIFF.fromArrayBuffer(buffer);
      }

      function productOutline(slug) {
        if (window.PRODUCT && window.PRODUCT.outlines[slug]) {
          return Promise.resolve(window.PRODUCT.outlines[slug]);
        }
        return fetch("municipios/" + slug + "/municipality.geojson").then((response) => response.json());
      }

      productManifest().then(async (manifest) => {
        document.getElementById("lead").textContent = manifest.note;
        const loaded = await Promise.all(manifest.places.map(async (meta) => {
          const tiff = await productTiff(meta);
          const image = await tiff.getImage();
          const rasters = await image.readRasters();
          const [west, south, east, north] = image.getBoundingBox();
          const stats = summarize(rasters);
          return {
            meta,
            slug: meta.slug,
            width: image.getWidth(),
            height: image.getHeight(),
            bands: rasters,
            leafletBounds: [[south, west], [north, east]],
            ...stats,
          };
        }));
        const placeBox = document.getElementById("places");
        loaded.forEach((place) => {
          places[place.slug] = place;
          const button = document.createElement("button");
          button.textContent = place.meta.place.split(",")[0];
          button.dataset.id = place.slug;
          button.onclick = () => select(place.slug, true);
          placeBox.appendChild(button);
          productOutline(place.slug)
            .then((geo) => {
              const outline = L.geoJSON(geo, { style: { color: "#fff4d6", weight: 1.4, fill: false } }).addTo(map);
              outline.on("click", () => select(place.slug, true));
            });
        });
        [["classe", "Class"], ["modis", "MODIS"], ["nisar", "NISAR"]].forEach(([id, label]) => {
          const button = document.createElement("button");
          button.textContent = label;
          button.dataset.id = id;
          button.onclick = () => { state.layer = id; draw(); if (state.slug) select(state.slug, false); };
          document.getElementById("layers").appendChild(button);
        });
        draw();
        const group = L.featureGroup(loaded.map((place) => L.rectangle(place.leafletBounds)));
        map.fitBounds(group.getBounds(), { paddingTopLeft: [460, 24], paddingBottomRight: [24, 24] });
        select(loaded[0].slug, false);
      }).catch((error) => {
        document.getElementById("lead").textContent = "Could not read the GeoTIFF. " + error;
      });
    </script>
  </body>
</html>
