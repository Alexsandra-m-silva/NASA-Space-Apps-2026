server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index modelo.html;
    absolute_redirect off;  # redirecionamentos relativos: mantém a porta publicada (8090)
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;

    location /api/ {
        proxy_pass http://dg-api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # web/products no repositório é um link simbólico para um caminho de outra máquina;
    # servimos a pasta products/ da raiz diretamente.
    location /products/ {
        alias /srv/products/;
    }

    # /comparar sem barra final também abre o app
    location = /comparar {
        return 301 /comparar/;
    }

    # App Streamlit "Comparar e explicar" (precisa de WebSocket)
    location /comparar/ {
        proxy_pass http://dg-comparar:8501/comparar/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://dg-api:8000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
