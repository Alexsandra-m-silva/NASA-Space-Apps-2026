server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index modelo.html;
    absolute_redirect off;  # redirecionamentos relativos: mantém host e porta de quem acessou
    gzip on;
    gzip_types application/json application/geo+json text/css application/javascript;

    # DNS interno do Docker, resolvido a cada requisição: se a API ou o comparar forem
    # recriados (novo IP), o nginx não fica preso ao endereço antigo (erro 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://guardian-api:8000;
    set $comparar_upstream http://guardian-comparar:8501;
    set $platform_upstream http://guardian-platform:3847;

    # Frontend Climate Sentinel (Next.js, platform/): raiz e rotas dele.
    location = / {
        proxy_pass $platform_upstream;
        proxy_set_header Host $host;
    }
    location ~ ^/(_next|explore|explorar|newsletter|compare|download|entrar|fluxos|onboarding|persona|preferencias|brand|geo|hero|about)(/|$) {
        proxy_pass $platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass $api_upstream;
    }

    # web/products no repositório é um link simbólico para outra máquina; os arquivos reais
    # ficam em products/ e são copiados para /srv/products na imagem.
    location /products/ {
        alias /srv/products/;
    }

    # /comparar sem barra final também abre o app
    location = /comparar {
        return 301 /comparar/;
    }

    # App Streamlit "Compare and explain" (precisa de WebSocket)
    location /comparar/ {
        proxy_pass $comparar_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
