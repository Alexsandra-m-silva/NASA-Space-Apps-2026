# Climate Guardian — desertification (NASA Space Apps 2026)
#
# Arquivo usado pelo Easypanel (serviço do tipo Compose). Nenhum serviço publica porta:
# na aba Domains, ligue o domínio ao serviço `guardian-web`, porta 80. O nginx desse
# serviço encaminha /api, /docs e /comparar/ pela rede interna.
#
# Local: o .env define COMPOSE_FILE com docker-compose.yml + docker-compose.local.yml
# (porta 8090 e o serviço de reprocessamento). Ver docs/DEPLOY_EASYPANEL.md.
#
# Os modelos já rodaram: os resultados vão dentro das imagens (app/bundle, products, web).
# O worker publica no PostGIS e termina; o navegador só exibe o que a API devolve.
#
# Prefixo guardian- evita colisão de nomes com outras stacks na rede do servidor.

x-db-url: &db-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD:-guardian-dev}@guardian-db:5432/${POSTGRES_DB:-guardian}

services:
  guardian-db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian-dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardian} -d ${POSTGRES_DB:-guardian}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Publica os resultados pré-calculados no PostGIS e termina.
  guardian-worker:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["python", "-m", "app.worker.publish"]
    environment:
      <<: *db-url
    depends_on:
      guardian-db: { condition: service_healthy }
    restart: "no"

  guardian-api:
    build: { context: ., dockerfile: docker/app.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *db-url
      # E-mail das recomendações (Brevo SMTP, mesmos nomes do Clinibud)
      BREVO_SMTP_LOGIN: ${BREVO_SMTP_LOGIN:-}
      BREVO_SMTP: ${BREVO_SMTP:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      EMAIL_ADMIN_TOKEN: ${EMAIL_ADMIN_TOKEN:-}
      # Chat com os dados da tela (Microsoft Foundry, API compatível com OpenAI)
      FOUNDRY_ENDPOINT: ${FOUNDRY_ENDPOINT:-}
      FOUNDRY_API_KEY: ${FOUNDRY_API_KEY:-}
      FOUNDRY_MODEL: ${FOUNDRY_MODEL:-}
    depends_on:
      guardian-db: { condition: service_healthy }
      guardian-worker: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # "Compare and explain": escolha o município e desenhe uma área (Streamlit).
  guardian-comparar:
    build: { context: ., dockerfile: docker/streamlit.Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/comparar/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Frontend Climate Sentinel (Next.js, pasta platform/), servido na raiz pelo guardian-web.
  guardian-platform:
    build: { context: ., dockerfile: docker/platform.Dockerfile }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3847/explore').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  guardian-web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    depends_on:
      guardian-api: { condition: service_healthy }
      guardian-comparar: { condition: service_started }
      guardian-platform: { condition: service_started }
    # `easypanel` é a rede do proxy do Easypanel: sem ela o domínio responde
    # "Service is not reachable". `default` mantém o acesso à API e ao comparar.
    networks:
      - default
      - easypanel

  # Agente Climate Sentinel (Gemini): gera as recomendações no servidor e grava no banco.
  #   docker compose run --rm guardian-sentinel
  guardian-sentinel:
    profiles: ["agente"]
    build: { context: ., dockerfile: docker/app.Dockerfile }
    command: ["python", "-m", "app.agent.sentinel"]
    environment:
      <<: *db-url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    depends_on:
      guardian-db: { condition: service_healthy }

volumes:
  pg_data:

networks:
  easypanel:
    external: true
